<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, Consolas, monospace">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1c4a68" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" fill="#0a1930"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <rect x="10" y="10" width="1180" height="680" fill="none" stroke="#5ec8e8" stroke-width="1.5"/>

  <text x="40" y="52" fill="#dff3fb" font-size="22" font-weight="700" letter-spacing="1">SMART EXHAUST GAS CLEANING SYSTEM (EGCS)</text>
  <text x="40" y="76" fill="#7fb8d6" font-size="13">Automated Closed-Loop Scrubber Control &#8212; Simplified P&amp;ID / Control Architecture</text>
  <line x1="40" y1="90" x2="1160" y2="90" stroke="#5ec8e8" stroke-width="1"/>

  <!-- Main Engine -->
  <rect x="60" y="260" width="140" height="90" fill="none" stroke="#dff3fb" stroke-width="1.6"/>
  <text x="130" y="300" fill="#dff3fb" font-size="13" text-anchor="middle">MAIN / AUX</text>
  <text x="130" y="318" fill="#dff3fb" font-size="13" text-anchor="middle">ENGINE(S)</text>

  <!-- Exhaust line -->
  <line x1="200" y1="305" x2="290" y2="305" stroke="#dff3fb" stroke-width="2"/>
  <polygon points="290,300 302,305 290,310" fill="#dff3fb"/>
  <text x="245" y="292" fill="#7fb8d6" font-size="10" text-anchor="middle">EXHAUST GAS</text>

  <!-- Scrubber Tower -->
  <rect x="310" y="160" width="150" height="290" fill="none" stroke="#dff3fb" stroke-width="1.6"/>
  <text x="385" y="300" fill="#dff3fb" font-size="13" text-anchor="middle">SCRUBBER</text>
  <text x="385" y="318" fill="#dff3fb" font-size="13" text-anchor="middle">TOWER</text>
  <text x="385" y="336" fill="#7fb8d6" font-size="10" text-anchor="middle">(open-loop wash)</text>
  <!-- spray nozzles -->
  <line x1="330" y1="190" x2="440" y2="190" stroke="#5ec8e8" stroke-width="1"/>
  <line x1="330" y1="210" x2="440" y2="210" stroke="#5ec8e8" stroke-width="1"/>
  <text x="385" y="180" fill="#5ec8e8" font-size="9" text-anchor="middle">WASH-WATER SPRAY DECK</text>

  <!-- Clean exhaust stack -->
  <line x1="385" y1="160" x2="385" y2="118" stroke="#dff3fb" stroke-width="2"/>
  <polygon points="380,118 385,106 390,118" fill="#dff3fb"/>
  <text x="385" y="132" fill="#7fb8d6" font-size="10" text-anchor="middle">TO FUNNEL / ATMOSPHERE</text>

  <!-- Wash water out to sensors -->
  <line x1="460" y1="305" x2="560" y2="305" stroke="#dff3fb" stroke-width="2"/>
  <polygon points="560,300 572,305 560,310" fill="#dff3fb"/>

  <!-- pH / SOx Analysers -->
  <rect x="580" y="260" width="150" height="90" fill="none" stroke="#dff3fb" stroke-width="1.6"/>
  <text x="655" y="298" fill="#dff3fb" font-size="12" text-anchor="middle">pH / SOx</text>
  <text x="655" y="316" fill="#dff3fb" font-size="12" text-anchor="middle">ANALYSERS (AI)</text>

  <!-- To discharge valve -->
  <line x1="730" y1="305" x2="830" y2="305" stroke="#dff3fb" stroke-width="2"/>
  <polygon points="830,300 842,305 830,310" fill="#dff3fb"/>

  <!-- Discharge Valve -->
  <circle cx="870" cy="305" r="30" fill="none" stroke="#dff3fb" stroke-width="1.6"/>
  <line x1="850" y1="285" x2="890" y2="325" stroke="#dff3fb" stroke-width="1.6"/>
  <line x1="850" y1="325" x2="890" y2="285" stroke="#dff3fb" stroke-width="1.6"/>
  <text x="870" y="352" fill="#7fb8d6" font-size="10" text-anchor="middle">DISCHARGE VALVE (DO)</text>

  <!-- To sea -->
  <line x1="900" y1="305" x2="1000" y2="305" stroke="#dff3fb" stroke-width="2"/>
  <polygon points="1000,300 1012,305 1000,310" fill="#dff3fb"/>
  <path d="M1020 290 q20 15 0 30 M1040 290 q20 15 0 30 M1060 290 q20 15 0 30" fill="none" stroke="#5ec8e8" stroke-width="1.4"/>
  <text x="1050" y="335" fill="#7fb8d6" font-size="10" text-anchor="middle">OVERBOARD</text>

  <!-- Dosing tank + pump -->
  <rect x="230" y="480" width="80" height="100" fill="none" stroke="#dff3fb" stroke-width="1.6"/>
  <text x="270" y="520" fill="#dff3fb" font-size="11" text-anchor="middle">NaOH</text>
  <text x="270" y="536" fill="#dff3fb" font-size="11" text-anchor="middle">DOSING</text>
  <text x="270" y="552" fill="#dff3fb" font-size="11" text-anchor="middle">TANK</text>
  <circle cx="270" cy="600" r="20" fill="none" stroke="#dff3fb" stroke-width="1.6"/>
  <text x="270" y="605" fill="#dff3fb" font-size="10" text-anchor="middle">P</text>
  <text x="270" y="638" fill="#7fb8d6" font-size="10" text-anchor="middle">ALKALINE DOSING PUMP (AO)</text>
  <line x1="270" y1="580" x2="270" y2="580" stroke="#dff3fb"/>
  <line x1="270" y1="580" x2="270" y2="580"/>
  <line x1="270" y1="480" x2="270" y2="480"/>
  <line x1="270" y1="580" x2="270" y2="580"/>
  <line x1="310" y1="530" x2="385" y2="530" stroke="#dff3fb" stroke-width="2"/>
  <line x1="385" y1="530" x2="385" y2="450" stroke="#dff3fb" stroke-width="2"/>
  <polygon points="380,460 385,448 390,460" fill="#dff3fb"/>

  <!-- PLC -->
  <rect x="560" y="480" width="180" height="110" fill="none" stroke="#f5a623" stroke-width="1.8"/>
  <text x="650" y="515" fill="#f5a623" font-size="13" text-anchor="middle" font-weight="700">PLC</text>
  <text x="650" y="533" fill="#f5a623" font-size="11" text-anchor="middle">Siemens S7-1500</text>
  <text x="650" y="549" fill="#f5a623" font-size="11" text-anchor="middle">FB_EGCS_ScrubberControl</text>
  <text x="650" y="567" fill="#7fb8d6" font-size="9" text-anchor="middle">(CODESYS-portable ST)</text>

  <!-- signal lines (dashed) -->
  <line x1="655" y1="350" x2="650" y2="480" stroke="#f5a623" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="270" y1="480" x2="560" y2="500" stroke="#f5a623" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="740" y1="510" x2="870" y2="335" stroke="#f5a623" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- GPS / ECA interlock -->
  <rect x="820" y="480" width="180" height="90" fill="none" stroke="#ef4b4b" stroke-width="1.8"/>
  <text x="910" y="512" fill="#ef4b4b" font-size="12" text-anchor="middle" font-weight="700">GPS / ECDIS</text>
  <text x="910" y="530" fill="#ef4b4b" font-size="11" text-anchor="middle">ECA POSITION CHECK</text>
  <text x="910" y="548" fill="#7fb8d6" font-size="9" text-anchor="middle">MARPOL Annex VI lockout</text>
  <line x1="820" y1="520" x2="740" y2="520" stroke="#ef4b4b" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Title block -->
  <rect x="880" y="600" width="290" height="70" fill="none" stroke="#5ec8e8" stroke-width="1"/>
  <text x="895" y="618" fill="#dff3fb" font-size="10">DWG NO: EGCS-ARCH-001</text>
  <text x="895" y="633" fill="#dff3fb" font-size="10">REV: A &#8212; SIMULATION / PORTFOLIO BUILD</text>
  <text x="895" y="648" fill="#dff3fb" font-size="10">AUTHOR: SIPHO LUCKY SIBANDA</text>
  <text x="895" y="663" fill="#7fb8d6" font-size="9">NOT FOR SHIPBOARD DEPLOYMENT</text>
</svg>
